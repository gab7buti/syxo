<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Syxo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0e27;
            color: #fff;
            min-height: 100vh;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #0f1419;
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            overflow-y: auto;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .menu-item {
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }

        .menu-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-left-color: #667eea;
        }

        .menu-item.active {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
            border-left-color: #667eea;
        }

        .main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff3b30;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .card {
            background: rgba(20, 25, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(102, 126, 234, 0.5);
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .link-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .link-title {
            font-weight: 600;
        }

        .link-url {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .delete-btn {
            padding: 6px 12px;
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: #ff3b30;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        .profile-link {
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .profile-link-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 5px;
        }

        .profile-link-url {
            font-size: 16px;
            font-weight: 600;
            color: #667eea;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">✨ Syxo</div>
            <div class="menu">
                <div class="menu-item active" onclick="showSection('links')">📎 Links</div>
                <div class="menu-item" onclick="showSection('profile')">👤 Perfil</div>
                <div class="menu-item" onclick="showSection('analytics')">📊 Analytics</div>
                <div class="menu-item" onclick="showSection('settings')">⚙️ Configurações</div>
            </div>
        </div>

        <div class="main">
            <div class="header">
                <h1 class="header-title">Dashboard</h1>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>

            <!-- Links Section -->
            <div class="content-section active" id="linksSection">
                <div class="profile-link">
                    <div class="profile-link-title">Seu Perfil</div>
                    <div class="profile-link-url" id="profileUrl">syxo.lol/seu_username</div>
                </div>

                <div class="card">
                    <h2 style="margin-bottom: 20px;">Adicionar Link</h2>
                    <div class="form-group">
                        <label class="form-label">Título</label>
                        <input type="text" class="form-input" id="linkTitle" placeholder="ex: Meu Instagram">
                    </div>
                    <div class="form-group">
                        <label class="form-label">URL</label>
                        <input type="text" class="form-input" id="linkUrl" placeholder="https://...">
                    </div>
                    <button class="btn" onclick="addLink()">Adicionar Link</button>
                </div>

                <div class="card">
                    <h2 style="margin-bottom: 20px;">Seus Links</h2>
                    <div class="links-list" id="linksList">
                        <p style="color: rgba(255, 255, 255, 0.5);">Nenhum link adicionado ainda</p>
                    </div>
                </div>
            </div>

            <!-- Profile Section -->
            <div class="content-section" id="profileSection">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Editar Perfil</h2>
                    <div class="form-group">
                        <label class="form-label">Bio</label>
                        <textarea class="form-textarea" id="profileBio" placeholder="Escreva algo sobre você..." style="min-height: 100px;"></textarea>
                    </div>
                    <button class="btn" onclick="saveProfile()">Salvar Perfil</button>
                </div>
            </div>

            <!-- Analytics Section -->
            <div class="content-section" id="analyticsSection">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Visualizações</h2>
                    <div style="font-size: 32px; font-weight: 700; color: #667eea;" id="viewCount">0</div>
                    <p style="color: rgba(255, 255, 255, 0.5); margin-top: 10px;">Total de visualizações do seu perfil</p>
                </div>
            </div>

            <!-- Settings Section -->
            <div class="content-section" id="settingsSection">
                <div class="card">
                    <h2 style="margin-bottom: 20px;">Configurações</h2>
                    <p style="color: rgba(255, 255, 255, 0.6);">Configurações adicionais em breve...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let links = [];
        let profile = {};

        function checkAuth() {
            const token = localStorage.getItem('auth_token');
            const username = localStorage.getItem('username');
            
            if (!token || !username) {
                window.location.href = '/';
                return;
            }

            document.getElementById('profileUrl').textContent = `syxo.lol/${username}`;
            loadData();
        }

        function showSection(section) {
            document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
            document.getElementById(section + 'Section').classList.add('active');

            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            event.target.classList.add('active');
        }

        async function loadData() {
            try {
                const response = await fetch('/api/user/data', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    links = data.links || [];
                    profile = data.profile || {};
                    
                    document.getElementById('profileBio').value = profile.bio || '';
                    document.getElementById('viewCount').textContent = profile.views || 0;
                    renderLinks();
                }
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function renderLinks() {
            const linksList = document.getElementById('linksList');
            
            if (links.length === 0) {
                linksList.innerHTML = '<p style="color: rgba(255, 255, 255, 0.5);">Nenhum link adicionado ainda</p>';
                return;
            }

            linksList.innerHTML = links.map((link, index) => `
                <div class="link-item">
                    <div>
                        <div class="link-title">${link.title}</div>
                        <div class="link-url">${link.url}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteLink(${index})">Deletar</button>
                </div>
            `).join('');
        }

        async function addLink() {
            const title = document.getElementById('linkTitle').value.trim();
            const url = document.getElementById('linkUrl').value.trim();

            if (!title || !url) {
                alert('Por favor, preencha todos os campos');
                return;
            }

            try {
                const response = await fetch('/api/links/add', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ title, url })
                });

                if (response.ok) {
                    document.getElementById('linkTitle').value = '';
                    document.getElementById('linkUrl').value = '';
                    loadData();
                } else {
                    alert('Erro ao adicionar link');
                }
            } catch (error) {
                alert('Erro de conexão');
            }
        }

        function deleteLink(index) {
            if (confirm('Tem certeza?')) {
                links.splice(index, 1);
                renderLinks();
            }
        }

        async function saveProfile() {
            const bio = document.getElementById('profileBio').value.trim();

            try {
                const response = await fetch('/api/profile/update', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('auth_token')}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ bio })
                });

                if (response.ok) {
                    alert('Perfil salvo com sucesso!');
                } else {
                    alert('Erro ao salvar perfil');
                }
            } catch (error) {
                alert('Erro de conexão');
            }
        }

        function logout() {
            if (confirm('Tem certeza que deseja sair?')) {
                localStorage.removeItem('auth_token');
                localStorage.removeItem('username');
                window.location.href = '/';
            }
        }

        window.addEventListener('load', checkAuth);
    </script>
</body>
</html>
