<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syxo - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #fff;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 40px;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(88, 101, 242, 0.5);
        }

        .username {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.8);
        }

        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .main-content {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 30px;
        }

        .sidebar {
            background: rgba(20, 25, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            height: fit-content;
        }

        .sidebar-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .slug-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .slug-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .slug-item:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(88, 101, 242, 0.5);
        }

        .slug-item.active {
            background: rgba(88, 101, 242, 0.2);
            border-color: rgba(88, 101, 242, 0.8);
            color: #667eea;
        }

        .new-slug-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .new-slug-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }

        .content {
            background: rgba(20, 25, 50, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255, 255, 255, 0.8);
        }

        .form-input, .form-textarea {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(88, 101, 242, 0.5);
        }

        .form-textarea {
            resize: vertical;
            min-height: 100px;
            font-family: inherit;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .preview {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
        }

        .preview-title {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .preview-link {
            color: #667eea;
            text-decoration: none;
            word-break: break-all;
            font-size: 13px;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(88, 101, 242, 0.3);
        }

        .save-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(20, 25, 50, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .modal-input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .modal-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .modal-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">✨ Syxo</div>
            <div class="user-info">
                <img class="avatar" id="userAvatar" src="" alt="Avatar">
                <span class="username" id="username"></span>
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="sidebar-title">Seus Perfis</div>
                <div class="slug-list" id="slugList"></div>
                <button class="new-slug-btn" onclick="openNewSlugModal()">+ Novo Perfil</button>
            </div>

            <div class="content" id="content">
                <div class="empty-state">
                    <div class="empty-icon">🎨</div>
                    <p>Selecione um perfil ou crie um novo para começar</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal para novo slug -->
    <div class="modal" id="newSlugModal">
        <div class="modal-content">
            <h2 class="modal-title">Novo Perfil</h2>
            <input type="text" class="modal-input" id="newSlugInput" placeholder="Digite o slug (ex: s, f, meu-perfil)" maxlength="20">
            <div class="modal-buttons">
                <button class="modal-btn secondary" onclick="closeNewSlugModal()">Cancelar</button>
                <button class="modal-btn primary" onclick="createNewSlug()">Criar</button>
            </div>
        </div>
    </div>

    <script>
        let currentSlug = null;
        let currentUser = null;

        // Load user data
        async function loadUser() {
            try {
                const response = await fetch('/api/user');
                if (!response.ok) throw new Error('Not authenticated');
                currentUser = await response.json();
                document.getElementById('username').textContent = currentUser.username;
                document.getElementById('userAvatar').src = `https://cdn.discordapp.com/avatars/${currentUser.id}/avatar.png`;
                loadSlugs();
            } catch (error) {
                window.location.href = '/';
            }
        }

        // Load user slugs
        async function loadSlugs() {
            try {
                const response = await fetch('/api/slugs');
                const data = await response.json();
                const slugList = document.getElementById('slugList');
                
                if (data.slugs.length === 0) {
                    slugList.innerHTML = '<p style="color: rgba(255,255,255,0.5); font-size: 13px;">Nenhum perfil criado</p>';
                    return;
                }

                slugList.innerHTML = data.slugs.map(slug => `
                    <div class="slug-item ${currentSlug === slug ? 'active' : ''}" onclick="selectSlug('${slug}')">
                        /${slug}
                    </div>
                `).join('');

                if (!currentSlug && data.slugs.length > 0) {
                    selectSlug(data.slugs[0]);
                }
            } catch (error) {
                console.error('Error loading slugs:', error);
            }
        }

        // Select slug
        async function selectSlug(slug) {
            currentSlug = slug;
            document.querySelectorAll('.slug-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            loadProfileForm();
        }

        // Load profile form
        async function loadProfileForm() {
            try {
                const response = await fetch(`/api/profile/${currentSlug}`);
                const profile = response.ok ? await response.json() : null;

                const content = document.getElementById('content');
                const profileUrl = `${window.location.origin}/${currentSlug}`;

                content.innerHTML = `
                    <form onsubmit="saveProfile(event)">
                        <div class="form-group">
                            <label class="form-label">Nome</label>
                            <input type="text" class="form-input" id="name" value="${profile?.name || currentUser.username}" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Bio</label>
                            <textarea class="form-textarea" id="bio" placeholder="Conte um pouco sobre você...">${profile?.bio || ''}</textarea>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Localização</label>
                                <input type="text" class="form-input" id="location" value="${profile?.location || ''}" placeholder="Ex: São Paulo, Brasil">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Instagram</label>
                                <input type="url" class="form-input" id="instagram" value="${profile?.instagram || ''}" placeholder="https://instagram.com/seu-usuario">
                            </div>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label class="form-label">Atividade (Nome)</label>
                                <input type="text" class="form-input" id="activityName" value="${profile?.activity?.name || ''}" placeholder="Ex: Escutando música">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Atividade (Detalhes)</label>
                                <input type="text" class="form-input" id="activityDetails" value="${profile?.activity?.details || ''}" placeholder="Ex: Vibes">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label">URL da Imagem de Fundo</label>
                            <input type="url" class="form-input" id="backgroundImage" value="${profile?.backgroundImage || ''}" placeholder="Cole a URL da imagem">
                        </div>

                        <div class="preview">
                            <div class="preview-title">Seu Perfil</div>
                            <a href="${profileUrl}" target="_blank" class="preview-link">${profileUrl}</a>
                        </div>

                        <button type="submit" class="save-btn">Salvar Perfil</button>
                    </form>
                `;
            } catch (error) {
                console.error('Error loading profile:', error);
            }
        }

        // Save profile
        async function saveProfile(event) {
            event.preventDefault();

            const profileData = {
                name: document.getElementById('name').value,
                bio: document.getElementById('bio').value,
                location: document.getElementById('location').value,
                instagram: document.getElementById('instagram').value,
                backgroundImage: document.getElementById('backgroundImage').value,
                activity: {
                    name: document.getElementById('activityName').value,
                    details: document.getElementById('activityDetails').value
                }
            };

            try {
                const response = await fetch(`/api/profile/${currentSlug}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(profileData)
                });

                if (response.ok) {
                    alert('Perfil salvo com sucesso!');
                } else {
                    alert('Erro ao salvar perfil');
                }
            } catch (error) {
                console.error('Error saving profile:', error);
                alert('Erro ao salvar perfil');
            }
        }

        // New slug modal
        function openNewSlugModal() {
            document.getElementById('newSlugModal').classList.add('active');
            document.getElementById('newSlugInput').focus();
        }

        function closeNewSlugModal() {
            document.getElementById('newSlugModal').classList.remove('active');
            document.getElementById('newSlugInput').value = '';
        }

        async function createNewSlug() {
            const slug = document.getElementById('newSlugInput').value.trim().toLowerCase();
            if (!slug) {
                alert('Digite um slug válido');
                return;
            }

            try {
                const response = await fetch(`/api/profile/${slug}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: slug })
                });

                if (response.ok) {
                    closeNewSlugModal();
                    loadSlugs();
                } else {
                    alert('Erro ao criar perfil');
                }
            } catch (error) {
                console.error('Error creating slug:', error);
                alert('Erro ao criar perfil');
            }
        }

        function logout() {
            window.location.href = '/api/logout';
        }

        // Initialize
        loadUser();
    </script>
</body>
</html>
