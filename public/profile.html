<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syxo - Discord Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            background: #0a0e27;
            color: #fff;
            overflow-x: hidden;
        }

        @keyframes sakura-fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .sakura {
            position: fixed;
            width: 20px;
            height: 20px;
            background: rgba(255, 182, 193, 0.7);
            border-radius: 50%;
            pointer-events: none;
            animation: sakura-fall linear infinite;
            z-index: 1;
        }

        .profile-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .profile-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10, 14, 39, 0.7);
            z-index: 2;
        }

        .profile-card {
            position: relative;
            z-index: 3;
            background: rgba(20, 25, 50, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .avatar {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(88, 101, 242, 0.5);
            object-fit: cover;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .status-indicator {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 4px solid rgba(20, 25, 50, 0.95);
            background: #43b581;
        }

        .status-indicator.idle {
            background: #faa61a;
        }

        .status-indicator.dnd {
            background: #f04747;
        }

        .status-indicator.offline {
            background: #747f8d;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
            margin: 15px 0 5px;
            color: #fff;
        }

        .username {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .location {
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
            margin-bottom: 20px;
        }

        .bio {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            line-height: 1.6;
            margin: 20px 0;
            min-height: 40px;
        }

        .activity {
            background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: left;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .activity-title {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.9);
        }

        .activity-subtitle {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            margin-top: 4px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 30px 0;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #fff;
        }

        .social-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-3px);
        }

        .social-btn.instagram-btn:hover {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            border-color: transparent;
        }

        .social-btn.discord-btn:hover {
            background: #5865F2;
            border-color: transparent;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 18px;
            color: rgba(255, 255, 255, 0.6);
            position: relative;
            z-index: 3;
        }

        @media (max-width: 600px) {
            .profile-card {
                padding: 30px 20px;
                max-width: 100%;
            }

            .name {
                font-size: 24px;
            }

            .avatar {
                width: 100px;
                height: 100px;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container" id="container">
        <div class="profile-overlay"></div>
        <div class="profile-card" id="profileCard">
            <div class="loading">Carregando...</div>
        </div>
    </div>

    <script>
        const slug = window.location.pathname.split('/')[1];

        async function loadProfile() {
            try {
                const response = await fetch(`/api/profile/${slug}`);
                if (!response.ok) throw new Error('Profile not found');
                
                const profile = await response.json();
                renderProfile(profile);
            } catch (error) {
                console.error('Error loading profile:', error);
                document.getElementById('profileCard').innerHTML = '<h1>Perfil não encontrado</h1>';
            }
        }

        function renderProfile(profile) {
            const container = document.getElementById('container');
            container.style.backgroundImage = `url('${profile.backgroundImage}')`;
            container.style.backgroundSize = 'cover';
            container.style.backgroundPosition = 'center';
            container.style.backgroundAttachment = 'fixed';

            const html = `
                <div class="profile-overlay"></div>
                <div class="profile-card">
                    <div class="avatar">
                        <img src="https://cdn.discordapp.com/avatars/${profile.discordId}/avatar.png" 
                             alt="${profile.name}"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ccircle cx=%2250%22 cy=%2250%22 r=%2250%22 fill=%22%235865F2%22/%3E%3C/svg%3E'">
                        <div class="status-indicator ${profile.status}"></div>
                    </div>

                    <h1 class="name">${profile.name}</h1>
                    <p class="username">@${profile.username}</p>

                    ${profile.location ? `<div class="location">📍 ${profile.location}</div>` : ''}

                    ${profile.bio ? `<p class="bio">${profile.bio}</p>` : ''}

                    ${profile.activity ? `
                        <div class="activity">
                            <div class="activity-title">🎵 ${profile.activity.name}</div>
                            <div class="activity-subtitle">${profile.activity.details}</div>
                        </div>
                    ` : ''}

                    <div class="social-buttons">
                        ${profile.instagram ? `
                            <a href="${profile.instagram}" target="_blank" rel="noopener noreferrer" 
                               class="social-btn instagram-btn" title="Instagram">📷</a>
                        ` : ''}
                        <a href="https://discord.com/users/${profile.discordId}" target="_blank" 
                           rel="noopener noreferrer" class="social-btn discord-btn" title="Discord">💬</a>
                    </div>

                    <div class="footer">
                        Made with ✨ by Syxo
                    </div>
                </div>
            `;

            document.getElementById('profileCard').parentElement.innerHTML = html;
            createSakura();
        }

        function createSakura() {
            const createParticle = () => {
                const sakura = document.createElement('div');
                sakura.className = 'sakura';
                sakura.style.left = Math.random() * 100 + '%';
                sakura.style.animationDuration = (Math.random() * 3 + 2) + 's';
                sakura.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(sakura);

                setTimeout(() => sakura.remove(), 5000);
            };

            const interval = setInterval(createParticle, 300);
        }

        loadProfile();
    </script>
</body>
</html>
